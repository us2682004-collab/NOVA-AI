<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NOVA AI Ultra Pro</title>

<style>

:root{
--text:#f8fafc;
--bot:#ffffff;
--user:#6d28d9;
--panel:rgba(15,23,42,.9);
--glass:rgba(255,255,255,.08);
}


.light{
--text:#0f172a;
--bot:#f1f5f9;
--user:#7c3aed;
--panel:rgba(255,255,255,.95);
--glass:rgba(0,0,0,.05);
}



*{
box-sizing:border-box;
}



body{

margin:0;
height:100vh;

font-family:Arial,Helvetica,sans-serif;

color:#00000f;

overflow:hidden;

background:
radial-gradient(circle at top,#38bdf8,#020617 55%);

}



body.light{

background:
linear-gradient(135deg,#dbeafe,#ffffff);

}




button{

border:0;
cursor:pointer;

border-radius:18px;

transition:.2s;

}



button:hover{

transform:scale(1.06);

}




/* side menu */

.side{

position:fixed;

top:0;
left:-290px;

width:280px;

height:100vh;

             background:#253340;

          backdrop-filter:;

z-index:20;

padding:15px;

display:flex;

flex-direction:column;

transition:.3s;

box-shadow:0 0 30px #0666;

}



.side.open{

left:0;

}



.side h2{

font-size:25px;

text-align:center;

}




.side button{

padding:15px;

margin:px 0;

background:#var(--glass);

color:#111111;

}



#list{

flex:1;

overflow:auto;

}




.item{

background:#fffff0;

padding:15px;

border-radius:20px;

margin:px 0;

display:flex;

align-items:center;

justify-content:space-between;

gap:5px;

}



.chatTitle{

font-size:20px;

font-weight:;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;

flex:1;

}



.smallBtn{

width:40px;

height:50px;

padding:1;

background:!important;

}





/* main */


.main{

height:100vh;

display:flex;

flex-direction:column;

}




.header{

height:70px;

display:flex;

align-items:center;

justify-content:center;

background:var(--glass);

backdrop-filter:;

position:relative;

}



.menu{

position:absolute;

left:15px;

font-size:32px;

cursor:pointer;

}



.header b{

font-size:20px;

}




.theme{

position:absolute;

right:8px;

display:flex;

gap:5px;

}




.lang{

background:#;2563eb

color:white;

padding:10px;

}







.chat{

flex:1;

overflow-y:auto;

padding:15px;

scroll-behavior:smooth;

}




.msg{

max-width:85%;

padding:15px;

margin:15px 0;

border-radius:22px;

background:#ffffff;

box-shadow:0 8px 20px #0064;

white-space:pre-wrap;

}



.user{

margin-left:auto;

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:#000000;

}






.bar{

display:flex;

gap:8px;

padding:12px;

background:fffff0;

backdrop-filter:;

position:relative;

}




input{

flex:1;

padding:14px;

border-radius:20px;

border:0;

outline:0;

background:var(--glass);

color:white;

}





.bar button{

background:#ffffff;

color:black;

padding:12px;

}






#plusMenu{

display:none;

position:absolute;

bottom:85px;

left:10px;

background:;

padding:12px;

border-radius:20px;



}



#plusMenu button{

display:block;

width:200px;

}





.cancel{

display:none;

background:red!important;

}




#mic{

background:#ffffff!important;

}




.back{

margin-top:10px;

}



@media(max-width:600px){

.header b{

font-size:14px;

}


.side{

width:85%;

}

}


</style>

</head>

<body>


<div class="side" id="side">

<h2>🤖 Chats</h2>

<h1>
<button onclick="newChat()">
➕ New Chat
</button>



<button onclick="openSearch()">
🔍 Search Chat
</button>

<h1>
<input id="searchChat"
placeholder="Search..."
style="display:none"
onkeyup="searchChats()">

</h1>

<div id="list"></div>


<button class="back" onclick="backMenu()">
⬅ Back
</button>

</h1>
</div>



<div class="main">


<div class="header">


<div class="menu" onclick="menu()">☰</div>


<b>🤖NOVA AI</b>


<div class="theme">

<button class="lang" onclick="changeLanguage('hi')">
हिं
</button>


<button class="lang" onclick="changeLanguage('en')">
EN
</button>


<button onclick="theme()">🌙</button>


<button onclick="exportTxt()">📄</button>


<button onclick="deleteAll()">🗑</button>


</div>


</div>



<div id="chat" class="chat"></div>


<div class="bar">


<button onclick="openPlus()">➕</button>


<div id="plusMenu">

<h1>
<button onclick="cameraOpen()">📷 Camera</button>
<BR>
<button onclick="photoOpen()">🖼 Photo</button>
<BR>
<button onclick="videoOpen()">🎥 Video</button>
<BR>
<button onclick="file.click()">📎 File</button>

</h1>
</div>


<input id="txt" placeholder="Type message">


<input type="file" id="file" hidden>

<input type="file" id="imageFile" accept="image/*" hidden>


<input type="file" id="videoFile" accept="video/*" hidden>


<button id="cancel" class="cancel" onclick="stopVoice()">✖</button>


<button id="mic" onclick="voice()">🎤</button>


<button onclick="send()">Send</button>


</div>


</div>
<script>

const KEY="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";
const MODEL="openai/gpt-4o-mini";


let language="hi";

let chats=JSON.parse(localStorage.NOVA||"[]");

if(!chats.length){

chats=[{
title:"Chat 1",
messages:[],
pin:false
}];

}


let cur=0;

let rec=null;

let listening=false;

let voiceMode=false;



function menu(){

side.classList.toggle("open");

}



function backMenu(){

side.classList.remove("open");

}



function theme(){

document.body.classList.toggle("light");

}





function save(){

localStorage.NOVA=
JSON.stringify(chats);

renderList();

}





function add(text,type){


chats[cur].messages.push({

text:text,

type:type

});


save();

render();

}






function render(){


chat.innerHTML="";



chats[cur].messages.forEach(m=>{


let d=document.createElement("div");


d.className="msg "+m.type;



d.innerHTML=

(m.type=="user"?"🙂 ":"🤖 ")+m.text;



chat.appendChild(d);



});



chat.scrollTop=
chat.scrollHeight;


}







function newChat(){


let n=prompt(
"Chat name"
);



if(!n)
n="New Chat";



chats.unshift({

title:n,

messages:[],

pin:false

});



cur=0;


save();

render();

}






txt.addEventListener(
"keydown",
e=>{


if(e.key=="Enter")
send();


});








async function send(){


let t=txt.value.trim();


if(!t)return;



txt.value="";



if(chats[cur].title=="Chat 1"){

chats[cur].title=
t.slice(0,25);

}



add(t,"user");


askAI();


}









async function askAI(){


let load=document.createElement("div");


load.className="msg";


load.innerHTML="🤖 Thinking...";


chat.appendChild(load);




try{


let r=await fetch(

"https://openrouter.ai/api/v1/chat/completions",

{


method:"POST",


headers:{


"Authorization":
"Bearer "+KEY,


"Content-Type":
"application/json"

},


body:JSON.stringify({


model:MODEL,


messages:[


{

role:"system",

content:

"You are NOVA AI. Reply only in "+
(language=="hi"?
"Hindi":
"English")

},




...chats[cur].messages.map(x=>({


role:

x.type=="user"?
"user":
"assistant",


content:x.text


}))


]

})


});





let data=await r.json();


load.remove();




if(!data.choices){

add(
"AI Error",
"bot"
);

return;

}




let ans=
data.choices[0]
.message
.content;



add(ans,"bot");



if(voiceMode){

speak(ans);

}



}



catch(e){


load.innerHTML=
"Connection Error";


}


}





function voice(){


let SR=

window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SR)return;




if(listening){

stopVoice();

return;

}



voiceMode=true;



rec=new SR();



rec.lang=

language=="hi"?
"hi-IN":
"en-US";



rec.continuous=true;

rec.interimResults=false;



rec.onstart=()=>{


listening=true;


mic.innerHTML="🛑";


cancel.style.display="block";


};




rec.onresult=e=>{


let text=

e.results[
e.results.length-1
][0].transcript;



txt.value=text;


send();



};




rec.onend=()=>{


if(listening)

rec.start();



};



rec.start();


}





function stopVoice(){


listening=false;


voiceMode=false;


if(rec)

rec.stop();



mic.innerHTML="🎤";


cancel.style.display="none";


}






function speak(t){


let u=
new SpeechSynthesisUtterance(t);


u.lang=

language=="hi"?
"hi-IN":
"en-US";


speechSynthesis.speak(u);


}






function changeLanguage(l){


language=l;



alert(

l=="hi"?
"Hindi ON":
"English ON"

);


}



function deleteAll(){


chats=[{

title:"Chat 1",

messages:[],

pin:false

}];


cur=0;


save();

render();


}







function openSearch(){


searchChat.style.display=

searchChat.style.display=="none"?

"block":

"none";


}







function searchChats(){


let v=

searchChat.value.toLowerCase();



document.querySelectorAll(".item")

.forEach(x=>{


x.style.display=

x.innerText
.toLowerCase()
.includes(v)?

"flex":

"none";



});


}







function deleteChat(i){


chats.splice(i,1);



if(!chats.length){


chats=[{

title:"Chat 1",

messages:[],

pin:false

}];

}



cur=0;


save();


render();


}







function pinChat(i){


chats[i].pin=
!chats[i].pin;


save();


renderList();


}







function renderList(){


list.innerHTML="";



let temp=[...chats];



temp.sort(
(a,b)=>
b.pin-a.pin
);




temp.forEach(c=>{


let i=
chats.indexOf(c);




let d=
document.createElement("div");



d.className="item";




d.innerHTML=

`

<div class="chatTitle">

${c.pin?"📌 ":""}

${c.title}

</div>

<button onclick="pinChat(${i})">

📌
</button>
<button class="smallBtn"
onclick="deleteChat(${i})">

✖

</button>

`;






d.querySelector(".chatTitle")
.onclick=()=>{


cur=i;


render();


backMenu();


};




list.appendChild(d);


});



}







function openPlus(){


plusMenu.style.display=

plusMenu.style.display=="block"?

"none":

"block";

}








function cameraOpen(){


let cam=
document.createElement("input");



cam.type="file";


cam.accept="image/*";



cam.capture="environment";



cam.click();



cam.onchange=e=>{


let f=e.target.files[0];



if(f){


add(

"📷 Camera Photo : "+
f.name,

"user"

);


}


};


}







function photoOpen(){


imageFile.click();


}







function videoOpen(){


videoFile.click();


}







imageFile.onchange=e=>{


let f=e.target.files[0];


if(!f)return;



add(

"🖼 Photo : "+f.name,

"user"

);


};






videoFile.onchange=e=>{


let f=e.target.files[0];


if(!f)return;



add(

"🎥 Video : "+f.name,

"user"

);


};







file.onchange=e=>{


let f=e.target.files[0];


if(!f)return;



add(

"📎 File : "+f.name,

"user"

);


};





function exportTxt(){


let text="";



chats[cur].messages.forEach(m=>{


text+=

(m.type=="user"?
"You: ":
"AI: ")

+m.text+
"\n\n";


});



let blob=
new Blob(
[text],
{
type:"text/plain"
}
);



let a=
document.createElement("a");


a.href=
URL.createObjectURL(blob);



a.download=
chats[cur].title+".txt";



a.click();



}







renderList();

render();




</script>

</body>

</html>
